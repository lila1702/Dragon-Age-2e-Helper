services:
  - type: web
    name: dragon-age-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install && npm run build:server
    startCommand: npm run migrate -w server && npm run start -w server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
